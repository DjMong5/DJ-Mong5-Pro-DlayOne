name: Compilar VST3 para Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar CMake
      run: cmake -B build

    - name: Compilar Plugin (Release)
      run: cmake --build build --config Release

    - name: Executar Testes (Ignora erro Headless)
      run: ctest --test-dir build -C Release --output-on-failure || true

    - name: Salvar o VST3 para Download
      uses: actions/upload-artifact@v4
      with:
        name: MeuPlugin-Windows-VST3
        path: build/
