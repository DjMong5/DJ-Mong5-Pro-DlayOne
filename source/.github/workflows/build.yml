name: Compilar VST3 para Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configurar CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Compilar Plugin (Release)
      run: cmake --build build --config Release --target DJMong5ProDlayOne

    - name: Salvar o VST3 para Download
      uses: actions/upload-artifact@v4
      with:
        name: MeuPlugin-Windows-VST3
        path: |
          build/**/*.vst3
          build/**/*.dll
          build/**/*.standalone
